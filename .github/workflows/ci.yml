name: CI

on:
  pull_request:   # run on every PR regardless of target branch
  push:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: favo
          POSTGRES_PASSWORD: favo
          POSTGRES_DB: favo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://favo:favo@localhost:5432/favo_test
      AUTH_SECRET: ci-test-secret-do-not-use-in-prod
      AUTH_URL: http://localhost:3000
      TZ: Africa/Johannesburg

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Owner decision (Nikao, 21 Oct 2026, AT-170): a risky migration (DROP,
      # type change, data delete/rewrite, or payments/orders/order_items) must
      # carry `-- favo:requires-approval`, or it would auto-apply on start.
      - name: Migration approval markers (blocking)
        run: bun scripts/check-migration-approval.ts

      - name: Typecheck
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Unit tests
        run: bun test:unit

      # ── E2E is a best-effort signal, NOT part of the merge gate. ──
      # CLAUDE.md defines the gate as typecheck · lint · test:unit.
      # The Phase 1 acceptance flow runs against seeded staging (PLANNING.md),
      # not an ephemeral CI dev server. We still run it here for early signal,
      # against a freshly migrated + seeded test DB, but it never blocks merge.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Create Supabase auth schema stub (CI only)
        run: |
          psql postgresql://favo:favo@localhost:5432/favo_test -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          "

      # The release migration step (AT-170, scripts/migrate.ts) — the same code
      # the production image runs from its entrypoint. Two runs start at once
      # against the fresh DB, then a third proves a re-run is a no-op. The
      # concurrent pair is a SMOKE TEST: it shows two overlapping runs both
      # exit 0 and leave a correct schema, but nothing proves they actually
      # contended for the advisory lock (one may finish before the other starts).
      #
      # A migration marked `-- favo:requires-approval` is refused unless
      # FAVO_APPROVE_MIGRATION names its tag (the production opt-in). This is a
      # throwaway test database, so the step approves every marked file. That is
      # safe: "Migration approval markers" above fails the job when a risky
      # migration is NOT marked, so nothing risky slips through unmarked.
      - name: Migrate test DB (release migrator, concurrent + re-run)
        run: |
          FAVO_APPROVE_MIGRATION="$(grep -l 'favo:requires-approval' drizzle/*.sql | xargs -r -n1 basename | sed 's/\.sql$//' | paste -sd, -)"
          export FAVO_APPROVE_MIGRATION
          echo "approving marked migrations on the test DB: ${FAVO_APPROVE_MIGRATION:-none}"
          bun scripts/migrate.ts & a=$!
          bun scripts/migrate.ts & b=$!
          wait $a
          wait $b
          bun scripts/migrate.ts | tee /tmp/rerun.log
          grep -q ", 0 pending" /tmp/rerun.log

      - name: Seed test DB
        run: bun db:seed

      # ── DB integration tests — BLOCKING. ──
      # These exercise DB-layer invariants that cannot be verified without a real
      # Postgres: the append-only audit_log trigger (L08/L12), the
      # loyalty_points >= 0 CHECK (L06), and RLS customer isolation (L13). They
      # SKIP when no DB is reachable (e.g. local dev), so they only assert here,
      # against the freshly migrated + seeded test DB.
      - name: DB integration tests (trigger · CHECK · RLS isolation)
        run: bun test:db

      - name: E2E tests (non-blocking signal)
        run: bun test:e2e:ci
        continue-on-error: true
