name: CI

on:
  pull_request:   # run on every PR regardless of target branch
  push:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: favo
          POSTGRES_PASSWORD: favo
          POSTGRES_DB: favo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://favo:favo@localhost:5432/favo_test
      AUTH_SECRET: ci-test-secret-do-not-use-in-prod
      AUTH_URL: http://localhost:3000
      TZ: Africa/Johannesburg

    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun typecheck

      - name: Lint
        run: bun lint

      - name: Unit tests
        run: bun test:unit

      # ── E2E is a best-effort signal, NOT part of the merge gate. ──
      # CLAUDE.md defines the gate as typecheck · lint · test:unit.
      # The Phase 1 acceptance flow runs against seeded staging (PLANNING.md),
      # not an ephemeral CI dev server. We still run it here for early signal,
      # against a freshly migrated + seeded test DB, but it never blocks merge.
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Create Supabase auth schema stub (CI only)
        run: |
          psql postgresql://favo:favo@localhost:5432/favo_test -c "
            CREATE SCHEMA IF NOT EXISTS auth;
            CREATE TABLE IF NOT EXISTS auth.users (id uuid PRIMARY KEY);
          "

      - name: Migrate test DB
        run: bun db:migrate

      - name: Seed test DB
        run: bun db:seed

      - name: E2E tests (non-blocking signal)
        run: bun test:e2e:ci
        continue-on-error: true
