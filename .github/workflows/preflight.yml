name: Pre-flight gate

# Trigger: manual dispatch from GitHub Actions UI, or automatically when the
# 'release-candidate' label is added to any pull request.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Staging URL to run E2E + Lighthouse against"
        required: false
        default: "http://localhost:3000"
  pull_request:
    types: [labeled]

jobs:
  preflight:
    name: Pre-flight (typecheck · lint · unit · E2E · Lighthouse)
    # For labeled events, only run when the label is 'release-candidate'
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'release-candidate')
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: favo
          POSTGRES_PASSWORD: favo
          POSTGRES_DB: favo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://favo:favo@localhost:5432/favo_test
      AUTH_SECRET: preflight-test-secret-do-not-use-in-prod
      AUTH_URL: http://localhost:3000
      TZ: Africa/Johannesburg
      # TEST_AUDIT_SECRET enables the audit-coverage assertion in full-suite.spec.ts
      TEST_AUDIT_SECRET: preflight-audit-secret
      # CRON_SECRET must match what the app reads; used by cron E2E tests
      CRON_SECRET: e2e-cron-secret
      PUBLIC_BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:3000' }}
      SKIP_LIGHTHOUSE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Migrate DB
        run: bun db:migrate

      - name: Seed DB
        run: bun db:seed

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run pre-flight script
        run: bash scripts/preflight.sh

      - name: Upload preflight.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preflight-report-${{ github.sha }}
          path: preflight.json
          retention-days: 30

      - name: Upload Playwright traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ github.sha }}
          path: playwright-report/
          retention-days: 7
