name: Docker publish

# Builds and pushes the production image to GHCR. This is the artefact that
# infra/coolify/favo-app.yml (and, eventually, whatever runs on Transformate)
# pulls — it does not deploy anywhere by itself. Uses the built-in
# GITHUB_TOKEN; no extra secrets required.

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/heritage-of-faith/favo-webapp:latest
            ghcr.io/heritage-of-faith/favo-webapp:${{ github.sha }}
