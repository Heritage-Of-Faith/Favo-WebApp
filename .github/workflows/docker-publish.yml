name: Docker publish

# Builds the production image. On push to main it is pushed to GHCR; on a
# pull request it is built only (never pushed), so a PR proves the image
# builds. This is the artefact the Transformate host (PRD §9) pulls — it does
# not deploy anywhere by itself. Uses the built-in GITHUB_TOKEN; no extra
# secrets required.
#
# NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY are inlined into the
# bundle at build time. On main they come from repository variables (public
# values, not secrets) and the job fails if either is empty; on a PR obvious
# placeholders are used because that image is never published.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Require public Supabase build values
        if: github.event_name == 'push'
        env:
          SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Repository variables NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY must both be set (Settings > Secrets and variables > Actions > Variables). Refusing to publish an image built without them."
            exit 1
          fi

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          # On a PR, load the image into the runner so the smoke test below can run it.
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ github.event_name == 'push' && vars.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.invalid' }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ github.event_name == 'push' && vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            IMAGE_SHA=${{ github.sha }}
          tags: |
            ghcr.io/heritage-of-faith/favo-webapp:latest
            ghcr.io/heritage-of-faith/favo-webapp:${{ github.sha }}

      # AT-169: prove the built image boots the in-app scheduler. No database is
      # attached, so catch-up fails loudly in the log — the assertion is only
      # that instrumentation.ts runs in the standalone server and registers the
      # jobs. TZ is reported, not gated: the scheduler applies UTC+2 itself.
      - name: Smoke-test the scheduler boots in the image
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name favo-smoke \
            -e SCHEDULER_ENABLED=true -e AUTH_SECRET=smoke \
            -e DATABASE_URL=postgresql://none:none@127.0.0.1:1/none \
            ghcr.io/heritage-of-faith/favo-webapp:${{ github.sha }}
          for i in $(seq 1 30); do
            docker logs favo-smoke 2>&1 | grep -q '\[scheduler\] started' && break
            sleep 1
          done
          docker logs favo-smoke 2>&1 | tail -20
          docker logs favo-smoke 2>&1 | grep -q '\[scheduler\] started: checkLowStock' \
            || { echo "::error::The image did not start the job scheduler"; exit 1; }
          offset=$(docker exec favo-smoke bun -e 'console.log(new Date().getTimezoneOffset())')
          [ "$offset" = "-120" ] || echo "::warning::Container clock is not SAST (offset $offset); check tzdata in the base image"
          docker rm -f favo-smoke
