<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Self-contained FAVO monogram: ring + F drawn as paths (no font dependency).
       Uses currentColor so it adapts to context (dark on light, light on dark). -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="currentColor" stroke-width="4"></circle>
  <g fill="currentColor">
    <rect x="40" y="30" width="7" height="40"></rect>
    <rect x="40" y="30" width="24" height="7"></rect>
    <rect x="40" y="46.5" width="18" height="6"></rect>
  </g>
</svg>
